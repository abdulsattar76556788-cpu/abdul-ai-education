
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103d32">
<title>Abdul AI | Islamic Education</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f3f7f4;color:#172c25;
 font-family:Arial,sans-serif;line-height:1.9
}
header{
 background:linear-gradient(135deg,#103d32,#187052);
 color:white;text-align:center;padding:30px 15px;
 border-radius:0 0 25px 25px
}
header h1{font-size:29px;margin:5px}
header p{margin:5px;color:#d9eee3}
.container{max-width:950px;margin:auto;padding:15px}
.controls{
 display:flex;flex-wrap:wrap;gap:9px;
 justify-content:center;margin:20px 0
}
button{
 border:0;border-radius:10px;padding:11px 17px;
 background:#e1eee7;color:#164b38;
 font-size:15px;font-weight:bold;cursor:pointer
}
button.active,button:hover{
 background:#146447;color:white
}
.search{
 width:100%;padding:14px;border:1px solid #ccdcd1;
 border-radius:12px;font-size:16px;margin:10px 0
}
.card{
 background:white;border:1px solid #e1eae4;
 border-radius:15px;padding:17px;margin:13px 0;
 box-shadow:0 3px 12px #173b2410
}
.card h3{color:#146447;margin-top:0}
.card p{margin:7px 0}
.section-title{text-align:center;color:#14533d}
.tag{
 display:inline-block;background:#e7f3eb;
 color:#14533d;padding:3px 10px;border-radius:20px;
 font-size:12px
}
.answer{
 background:#f0f7f2;padding:12px;
 border-right:4px solid #18805a;border-radius:8px;
 margin:10px 0
}
footer{
 background:#103d32;color:white;text-align:center;
 padding:20px;margin-top:30px
}
.hidden{display:none}
[dir="ltr"] .answer{border-right:0;border-left:4px solid #18805a}
</style>
</head>
<body>

<header>
<h1>☪ Abdul AI Islamic Education</h1>
<p id="subtitle">اسلامیات لازمی | پنجاب بورڈ</p>
<p>Classes 9 • 10 • 11 • 12</p>
</header>

<div class="container">

<h2 class="section-title" id="welcome">
اسلامیات کے تعلیمی پورٹل میں خوش آمدید
</h2>

<div class="controls">
<button class="active" onclick="setClass(9,this)">کلاس 9</button>
<button onclick="setClass(10,this)">کلاس 10</button>
<button onclick="setClass(11,this)">کلاس 11</button>
<button onclick="setClass(12,this)">کلاس 12</button>
</div>

<div class="controls">
<button onclick="setLang('ur')">اردو</button>
<button onclick="setLang('en')">English</button>
</div>

<input class="search" id="search"
placeholder="سبق یا موضوع تلاش کریں..."
oninput="render()">

<h2 id="classTitle" class="section-title">کلاس نہم اسلامیات</h2>

<div class="controls">
<button onclick="showAll()">تمام اسباق</button>
<button onclick="showType('notes')">نوٹس</button>
<button onclick="showType('questions')">سوالات</button>
<button onclick="showType('mcq')">MCQs</button>
</div>

<div id="lessons"></div>

</div>

<footer>
<h3>Abdul AI Education</h3>
<p>علم حاصل کرنا ہر مسلمان کے لیے اہم ہے۔</p>
<p>Islamic Education | Punjab Board</p>
</footer>

<script>
let currentClass=9;
let language='ur';
let filter='all';

const data=[
{
title:'قرآن مجید کا تعارف',
en:'Introduction to the Holy Quran',
notes:'قرآن مجید اللہ تعالیٰ کی آخری آسمانی کتاب ہے جو حضرت محمد ﷺ پر نازل ہوئی۔ یہ تمام انسانیت کے لیے ہدایت کا سرچشمہ ہے۔',
enNotes:'The Holy Quran is the final revealed book of Allah, sent to Prophet Muhammad (PBUH). It is a source of guidance for all humanity.',
questions:'قرآن مجید کس پر نازل ہوا؟ قرآن مجید کی تعلیمات کیا ہیں؟',
enQuestions:'Upon whom was the Holy Quran revealed? What are its teachings?',
mcq:'قرآن مجید کس نبی پر نازل ہوا؟',
enMcq:'To which Prophet was the Holy Quran revealed?',
options:['حضرت موسیٰؑ','حضرت عیسیٰؑ','حضرت محمد ﷺ','حضرت ابراہیمؑ'],
enOptions:['Musa (AS)','Isa (AS)','Muhammad (PBUH)','Ibrahim (AS)'],
correct:2
},
{
title:'حدیث و سنت',
en:'Hadith and Sunnah',
notes:'حدیث سے مراد رسول اللہ ﷺ کے اقوال، افعال اور تقریرات ہیں۔ سنت آپ ﷺ کے طریقے کو کہتے ہیں۔',
enNotes:'Hadith refers to the sayings, actions and approvals of Prophet Muhammad (PBUH). Sunnah means his way of life.',
questions:'حدیث کی تعریف لکھیں۔ سنت سے کیا مراد ہے؟',
enQuestions:'Define Hadith. What is meant by Sunnah?',
mcq:'حدیث میں کیا شامل ہے؟',
enMcq:'What does Hadith include?',
options:['اقوال و افعال','صرف تاریخ','صرف شاعری','صرف کہانیاں'],
enOptions:['Sayings and actions','History only','Poetry only','Stories only'],
correct:0
},
{
title:'ایمان اور عقائد',
en:'Faith and Beliefs',
notes:'اسلام میں ایمان کے بنیادی ارکان اللہ، فرشتوں، آسمانی کتابوں، رسولوں، آخرت اور تقدیر پر ایمان ہیں۔',
enNotes:'The articles of faith include belief in Allah, angels, revealed books, messengers, the Last Day and divine decree.',
questions:'ایمان کے بنیادی ارکان بیان کریں۔ توحید سے کیا مراد ہے؟',
enQuestions:'Describe the articles of faith. What is Tawheed?',
mcq:'ایمان کے ارکان میں کون سا شامل ہے؟',
enMcq:'Which is an article of faith?',
options:['فرشتوں پر ایمان','دولت جمع کرنا','کھیلنا','سفر کرنا'],
enOptions:['Belief in angels','Collecting wealth','Playing','Travelling'],
correct:0
},
{
title:'عبادات',
en:'Worship in Islam',
notes:'اسلام میں نماز، روزہ، زکوٰۃ اور حج اہم عبادات ہیں۔ عبادات انسان میں تقویٰ، نظم و ضبط اور اللہ کی اطاعت پیدا کرتی ہیں۔',
enNotes:'Prayer, fasting, Zakat and Hajj are important acts of worship in Islam. They develop piety, discipline and obedience to Allah.',
questions:'اسلام کے بنیادی ارکان لکھیں۔ نماز کی اہمیت بیان کریں۔',
enQuestions:'Name the pillars of Islam. Explain the importance of Salah.',
mcq:'رمضان کے روزے کس مہینے میں رکھے جاتے ہیں؟',
enMcq:'In which month do Muslims fast?',
options:['محرم','رمضان','شوال','رجب'],
enOptions:['Muharram','Ramadan','Shawwal','Rajab'],
correct:1
},
{
title:'سیرت النبی ﷺ',
en:'Life of Prophet Muhammad (PBUH)',
notes:'حضرت محمد ﷺ کی مبارک زندگی تمام مسلمانوں کے لیے بہترین نمونہ ہے۔ آپ ﷺ نے عدل، رحم، امانت اور سچائی کی تعلیم دی۔',
enNotes:'The blessed life of Prophet Muhammad (PBUH) is the best example for Muslims. He taught justice, mercy, honesty and truthfulness.',
questions:'سیرت النبی ﷺ سے ہمیں کیا سبق ملتا ہے؟ آپ ﷺ کے اخلاق بیان کریں۔',
enQuestions:'What lessons do we learn from the Seerah? Describe his character.',
mcq:'نبی کریم ﷺ کس شہر میں پیدا ہوئے؟',
enMcq:'In which city was Prophet Muhammad (PBUH) born?',
options:['مدینہ','مکہ','طائف','یروشلم'],
enOptions:['Madinah','Makkah','Taif','Jerusalem'],
correct:1
},
{
title:'اسلامی اخلاق و آداب',
en:'Islamic Ethics and Manners',
notes:'اسلام سچائی، صبر، شکر، احترام والدین، حسن سلوک اور امانت داری کی تعلیم دیتا ہے۔',
enNotes:'Islam teaches truthfulness, patience, gratitude, respect for parents, kindness and trustworthiness.',
questions:'والدین کے حقوق بیان کریں۔ سچائی کی اہمیت کیا ہے؟',
enQuestions:'Describe the rights of parents. Why is truthfulness important?',
mcq:'اسلام کس چیز کی تعلیم دیتا ہے؟',
enMcq:'What does Islam teach?',
options:['جھوٹ','بددیانتی','سچائی','ظلم'],
enOptions:['Lying','Dishonesty','Truthfulness','Injustice'],
correct:2
}
];

function setClass(n,btn){
 currentClass=n;
 document.querySelectorAll('.controls button').forEach(b=>{
 if(b.textContent.includes('کلاس')) b.classList.remove('active');
 });
 btn.classList.add('active');
 render();
}

function setLang(l){
 language=l;
 document.documentElement.lang=l;
 document.documentElement.dir=l==='ur'?'rtl':'ltr';
 document.getElementById('subtitle').textContent=
 l==='ur'?'اسلامیات لازمی | پنجاب بورڈ':'Compulsory Islamiyat | Punjab Board';
 document.getElementById('welcome').textContent=
 l==='ur'?'اسلامیات کے تعلیمی پورٹل میں خوش آمدید':'Welcome to Islamic Education Portal';
 document.getElementById('search').placeholder=
 l==='ur'?'سبق یا موضوع تلاش کریں...':'Search lessons or topics...';
 render();
}

function showAll(){filter='all';render()}
function showType(t){filter=t;render()}

function render(){
 const ur=language==='ur';
 const q=document.getElementById('search').value.toLowerCase();
 document.getElementById('classTitle').textContent=
 ur?'کلاس '+(currentClass===9?'نہم':currentClass===10?'دہم':currentClass===11?'گیارہویں':'بارہویں')+' اسلامیات':
 'Class '+currentClass+' Islamiyat';

 let html='';
 data.forEach((item,i)=>{
 const title=ur?item.title:item.en;
 if(!title.toLowerCase().includes(q) &&
 !(ur?item.notes:item.enNotes).toLowerCase().includes(q)) return;

 html+=`<div class="card">
 <span class="tag">${ur?'سبق':'Lesson'} ${i+1}</span>
 <h3>${title}</h3>`;

 if(filter==='all'||filter==='notes'){
 html+=`<h4>${ur?'سبق کے نوٹس':'Lesson Notes'}</h4>
 <p>${ur?item.notes:item.enNotes}</p>`;
 }
 if(filter==='all'||filter==='questions'){
 html+=`<div class="answer"><b>${ur?'اہم سوالات':'Important Questions'}</b>
 <p>${ur?item.questions:item.enQuestions}</p></div>`;
 }
 if(filter==='all'||filter==='mcq'){
 html+=`<div class="answer"><b>${ur?item.mcq:item.enMcq}</b>
 <p>${(ur?item.options:item.enOptions).map((o,j)=>
 `<label style="display:block"><input type="radio" name="mcq${i}" value="${j}"> ${o}</label>`).join('')}</p>
 <button onclick="check(${i})">${ur?'جواب چیک کریں':'Check Answer'}</button>
 <p id="result${i}"></p></div>`;
 }
 html+='</div>';
 });
 document.getElementById('lessons').innerHTML=html||
 '<p>کوئی نتیجہ نہیں ملا۔ / No results found.</p>';
}

function check(i){
 const selected=document.querySelector('input[name="mcq'+i+'"]:checked');
 const result=document.getElementById('result'+i);
 if(!selected){
 result.textContent=language==='ur'?'پہلے جواب منتخب کریں۔':'Select an answer first.';
 return;
 }
 result.textContent=Number(selected.value)===data[i].correct?
 (language==='ur'?'درست جواب! ماشاءاللہ':'Correct! Well done.'):
 (language==='ur'?'جواب درست نہیں، دوبارہ کوشش کریں۔':'Incorrect. Try again.');
}

render();
</script>
</body>
</html>
