let selected=0;

function showChapters(){
 let lang=document.getElementById("lang").value;
 let search=document.getElementById("search").value.toLowerCase();
 let box=document.getElementById("chapters");
 box.innerHTML="";
 data.forEach((d,i)=>{
 let name=lang==="ur"?d.ur:d.en;
 if(name.toLowerCase().includes(search)){
 let b=document.createElement("button");
 b.textContent=(i+1)+". "+name;
 b.onclick=()=>{selected=i;showChapter()};
 box.appendChild(b);
 }
 });
}

function showChapter(){
 showChapters();
 let d=data[selected];
 let lang=document.getElementById("lang").value;
 let name=lang==="ur"?d.ur:d.en;
 let notes=d.notes[lang];
 let questions=lang==="ur"?d.qur:d.qen;
 document.getElementById("heading").textContent=
 "باب "+(selected+1)+": "+name;
 let c=document.getElementById("content");
 c.className="note "+(lang==="en"?"english":"");
 c.textContent=notes+
 "\n\n"+(lang==="ur"?"اہم مختصر سوالات":"Important Short Questions")+
 "\n\n"+questions.map((q,i)=>(i+1)+". "+q).join("\n");
}
showChapter();
